<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Tracking Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-trophy text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">Album Inventory Manager</h1>
                    <p class="text-xs text-slate-500 font-medium">977 Global Records Tracked</p>
                </div>
            </div>
            <button id="resetBtn" class="text-sm font-medium text-slate-500 hover:text-rose-600 transition-colors flex items-center space-x-1 px-3 py-2 rounded-lg hover:bg-slate-100 cursor-pointer">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                <span>Reset All Progress</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center space-x-4">
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i class="fa-solid fa-database text-xl"></i></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Album</p>
                    <p id="statTotal" class="text-xl font-bold text-slate-900">977</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center space-x-4">
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i class="fa-solid fa-circle-check text-xl"></i></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Collected</p>
                    <p id="statCollected" class="text-xl font-bold text-slate-900">0</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center space-x-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i class="fa-solid fa-circle-xmark text-xl"></i></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Needed</p>
                    <p id="statMissing" class="text-xl font-bold text-slate-900">977</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center space-x-4">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl"><i class="fa-solid fa-clone text-xl"></i></div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Duplicates</p>
                    <p id="statDuplicates" class="text-xl font-bold text-rose-600">0</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 flex flex-col justify-center">
                <div class="flex items-center justify-between w-full mb-1">
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Completion</p>
                    <span id="statPercent" class="text-sm font-bold text-indigo-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search by name, prefix, or team..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <select id="teamFilter" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none"><option value="all">All Teams / Sections</option></select>
                </div>
                <div class="grid grid-cols-4 bg-slate-100 p-1 rounded-xl text-xs font-medium text-center">
                    <button id="viewAll" class="py-2 rounded-lg bg-white text-slate-900 shadow-xs cursor-pointer">All</button>
                    <button id="viewMissing" class="py-2 rounded-lg text-slate-600 hover:text-slate-900 cursor-pointer">Needed</button>
                    <button id="viewCollected" class="py-2 rounded-lg text-slate-600 hover:text-slate-900 cursor-pointer">Owned</button>
                    <button id="viewDuplicates" class="py-2 rounded-lg text-slate-600 hover:text-rose-600 cursor-pointer">Dupes</button>
                </div>
            </div>
        </section>

        <section id="stickersContainer" class="space-y-8"></section>

        <section id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center space-y-3">
            <div class="bg-slate-100 p-4 rounded-full text-slate-400"><i class="fa-solid fa-folder-open text-3xl"></i></div>
            <div>

                <p class="text-xs text-slate-500">Refine your keywords or change your status tabs.</p>
            </div>
        </section>
    </main>

                { team: "Uruguay", code: "URU", size: 20, names: {1:"Uruguay Logo", 2:"Fernando Muslera", 3:"Sergio Rochet", 4:"Diego Godín", 5:"José María Giménez", 6:"Martín Cáceres", 7:"Sebastian Coates", 8:"Ronald Araújo", 9:"Matías Viña", 10:"Federico Valverde", 11:"Rodrigo Bentancur", 12:"Matías Vecino", 13:"Giorgian de Arrascaeta", 14:"Lucas Torreira", 15:"Nicolás de la Cruz", 16:"Luis Suárez", 17:"Edinson Cavani", 18:"Darwin Núñez", 19:"Facundo Pellistri", 20:"Team Photo"} },
                { team: "South Korea", code: "KOR", size: 20, names: {1:"South Korea Logo", 2:"Kim Seung-gyu", 3:"Jo Hyeon-woo", 4:"Kim Young-gwon", 5:"Kim Min-jae", 6:"Kim Jin-su", 7:"Hong Chul", 8:"Kim Tae-hwan", 9:"Lee Yong", 10:"Jung Woo-young", 11:"Hwang In-beom", 12:"Lee Jae-sung", 13:"Kwon Chang-hoon", 14:"Hwang Hee-chan", 15:"Son Heung-min", 16:"Hwang Ui-jo", 17:"Cho Gue-sung", 18:"Song Min-kyu", 19:"Jeong Woo-yeong", 20:"Team Photo"} },
                { team: "Museum Legends", code: "LEG", size: 18, names: {1:"Pelé", 2:"Diego Maradona", 3:"Zinedine Zidane", 4:"Ronaldo Nazário", 5:"Franz Beckenbauer", 6:"Johan Cruyff", 7:"Michel Platini", 8:"Miroslav Klose", 9:"Gerd Müller", 10:"Eusébio", 11:"Lev Yashin", 12:"Bobby Charlton", 13:"Romário", 14:"Paolo Maldini", 15:"Roberto Baggio", 16:"Cafu", 17:"Xavi Hernandez", 18:"Andrés Iniesta"} }
            ];

            // 1. Loop through structured main layout arrays
            groups.forEach(group => {
                for(let i = 1; i <= group.size; i++) {
                    let itemName = group.names[i] || `Squad Member ${i}`;
                    let isSpecial = (i === 1 || group.team === "Tournament Openers" || group.team === "Museum Legends" || i === 11 || i === 16);
                    
                    stickersData.push({
                        "Code": `${group.code}${i}`,
                        "Title": itemName,
                        "Team": group.team,
                        "Category": i === 1 ? "Logo/Badge" : (i === group.size && group.size === 20 ? "Team Lineup" : "Player"),
                        "Rarity": isSpecial ? "Foil" : "Base"
                    });
                }
            });

            // 2. Padding block generates entries to hit the 977 item count safely
            const placeholderPool = [
                "Algeria", "Italy", "Sweden", "Chile", "Colombia", "Peru", "Egypt", "Nigeria", 
                "Ivory Coast", "Turkey", "Ukraine", "Greece", "Austria", "Norway", "Czechia", "Romania"
            ];
            
            let poolIndex = 0;
            let subIndex = 1;

            while(stickersData.length < 977) {
                let currentPrefix = placeholderPool[poolIndex].substring(0,3).toUpperCase();
                let isFoilItem = (subIndex === 1 || subIndex === 10);
                
                stickersData.push({
                    "Code": `${currentPrefix}${subIndex}`,
                    "Title": subIndex === 1 ? `${placeholderPool[poolIndex]} Shield` : `Pro Player ${subIndex} (${placeholderPool[poolIndex]})`,
                    "Team": `${placeholderPool[poolIndex]} (Extended Pool)`,
                    "Category": subIndex === 1 ? "Logo/Badge" : "Player",
                    "Rarity": isFoilItem ? "Foil" : "Base"
                });

                subIndex++;
                if(subIndex > 20) {
                    subIndex = 1;
                    poolIndex = (poolIndex + 1) % placeholderPool.length;
                }
            }
        }

        function populateTeamDropdown() {
            const teams = [...new Set(stickersData.map(s => s.Team))];
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamFilter.appendChild(option);
            });
        }

        function getStats() {
            const total = stickersData.length;
            let collected = 0;
            let dupes = 0;

            stickersData.forEach(s => {
                const count = stickerInventory[s.Code] || 0;
                if(count > 0) {
                    collected++;
                    dupes += (count - 1);
                }
            });

            const missing = total - collected;
            const pct = Math.round((collected / total) * 100);

            document.getElementById('statCollected').textContent = collected;
            document.getElementById('statMissing').textContent = missing;
            document.getElementById('statDuplicates').textContent = dupes;
            document.getElementById('statPercent').textContent = pct + '%';
            document.getElementById('progressBar').style.width = pct + '%';
        }

        function updateItemQuantity(code, delta) {
            let count = stickerInventory[code] || 0;
            count += delta;

            if(count <= 0) {
                delete stickerInventory[code];
            } else {
                stickerInventory[code] = count;
            }

            localStorage.setItem('sticker_inventory_v2', JSON.stringify(stickerInventory));
            getStats();

            if (activeView !== 'all') {
                renderStickers();
            } else {
                const card = document.getElementById(`card-${code}`);
                const badge = document.getElementById(`badge-${code}`);
                const displayCount = document.getElementById(`qty-${code}`);
                const currentCount = stickerInventory[code] || 0;

                if(card) {
                    displayCount.textContent = currentCount;
                    if(currentCount > 0) {
                        card.className = 'p-4 rounded-xl border border-emerald-200 bg-emerald-50/20 transition-all flex flex-col justify-between space-y-3 relative select-none';
                        badge.className = 'absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-600 text-white shadow-xs';
                        badge.textContent = currentCount === 1 ? 'Owned' : `+${currentCount - 1} Dupe`;
                    } else {
                        card.className = 'p-4 rounded-xl border border-slate-200 hover:bg-slate-100/50 transition-all flex flex-col justify-between space-y-3 relative select-none';
                        badge.className = 'hidden';
                    }
                }
            }
        }

        function renderStickers() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const selectedTeam = teamFilter.value;

            stickersContainer.innerHTML = '';

            const filtered = stickersData.filter(s => {
                const matchSearch = s.Title.toLowerCase().includes(searchVal) || s.Code.toLowerCase().includes(searchVal) || s.Team.toLowerCase().includes(searchVal);
                const matchTeam = selectedTeam === 'all' || s.Team === selectedTeam;
                
                const count = stickerInventory[s.Code] || 0;
                let matchTab = true;
                if(activeView === 'missing') matchTab = (count === 0);
                if(activeView === 'collected') matchTab = (count > 0);
                if(activeView === 'dupes') matchTab = (count > 1);

                return matchSearch && matchTeam && matchTab;
            });

            if(filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            const teamGroups = {};
            filtered.forEach(s => {
                if(!teamGroups[s.Team]) teamGroups[s.Team] = [];
                teamGroups[s.Team].push(s);
            });

            Object.keys(teamGroups).forEach(team => {
                const section = document.createElement('div');
                section.className = 'bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xs';
                
                const groupItems = teamGroups[team];
                const totalOwnedInGroup = groupItems.filter(s => (stickerInventory[s.Code] || 0) > 0).length;

                section.innerHTML = `
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-3.5 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-slate-900">${team}</span>
                            <span class="bg-slate-200 text-slate-700 text-[11px] font-semibold px-2 py-0.5 rounded-full">${groupItems.length} items</span>
                        </div>
                        <span class="text-xs font-semibold text-slate-500">Collected: ${totalOwnedInGroup} / ${groupItems.length}</span>
                    </div>
                `;

                const grid = document.createElement('div');
                grid.className = 'p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4';

                groupItems.forEach(item => {
                    const card = document.createElement('div');
                    const qty = stickerInventory[item.Code] || 0;
                    card.id = `card-${item.Code}`;
                    
                    card.className = `p-4 rounded-xl border transition-all flex flex-col justify-between space-y-3 relative select-none ${
                        qty > 0 ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200 hover:bg-slate-100/50'
                    }`;

                    const rarityTheme = item.Rarity === 'Foil' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-slate-100 text-slate-600 border-slate-200';
                    const badgeClass = qty === 0 ? 'hidden' : 'absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-600 text-white shadow-xs';

                    card.innerHTML = `
                        <span id="badge-${item.Code}" class="${badgeClass}">${qty === 1 ? 'Owned' : `+${qty - 1} Dupe`}</span>
                        <div class="space-y-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[11px] font-mono font-bold bg-slate-900 text-white px-1.5 py-0.5 rounded">${item.Code}</span>
                                <span class="text-[10px] border px-1.5 py-0.5 rounded-full font-bold uppercase ${rarityTheme}">${item.Rarity}</span>
                            </div>
                            <h3 class="text-sm font-semibold text-slate-800 pt-1 text-truncate" title="${item.Title}">${item.Title}</h3>
                            <p class="text-[11px] text-slate-400 font-medium">${item.Category}</p>
                        </div>
                        <div class="flex items-center justify-between border-t border-slate-100 pt-2.5">
                            <span class="text-xs text-slate-400 font-medium">Quantity</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="event.stopPropagation(); updateItemQuantity('${item.Code}', -1)" class="w-7 h-7 flex items-center justify-center bg-white border border-slate-200 hover:bg-slate-50 rounded-lg text-slate-700 font-bold transition-colors cursor-pointer">-</button>
                                <span id="qty-${item.Code}" class="text-sm font-bold w-5 text-center text-slate-800">${qty}</span>
                                <button onclick="event.stopPropagation(); updateItemQuantity('${item.Code}', 1)" class="w-7 h-7 flex items-center justify-center bg-white border border-slate-200 hover:bg-slate-50 rounded-lg text-slate-700 font-bold transition-colors cursor-pointer">+</button>
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', () => updateItemQuantity(item.Code, 1));
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                stickersContainer.appendChild(section);
            });
        }

        function selectTab(view, activeBtn, inactiveBtns) {
            activeView = view;
            activeBtn.className = "py-2 rounded-lg bg-white text-slate-900 shadow-xs cursor-pointer";
            inactiveBtns.forEach(btn => btn.className = "py-2 rounded-lg text-slate-600 hover:text-slate-900 cursor-pointer");
            renderStickers();
        }

        viewAll.addEventListener('click', () => selectTab('all', viewAll, [viewMissing, viewCollected, viewDuplicates]));
        viewMissing.addEventListener('click', () => selectTab('missing', viewMissing, [viewAll, viewCollected, viewDuplicates]));
        viewCollected.addEventListener('click', () => selectTab('collected', viewCollected, [viewAll, viewMissing, viewDuplicates]));
        viewDuplicates.addEventListener('click', () => selectTab('dupes', viewDuplicates, [viewAll, viewMissing, viewCollected]));

        searchInput.addEventListener('input', renderStickers);
        teamFilter.addEventListener('change', renderStickers);

        resetBtn.addEventListener('click', () => {
            if(confirm('Are you sure you want to clear your entire checklist collection and duplicate progress?')) {
                stickerInventory = {};
                localStorage.removeItem('sticker_inventory_v2');
                getStats();
                renderStickers();
            }
        });

        // Initialize execution sequence
        compileDataset();
        populateTeamDropdown();
        getStats();
        renderStickers();
    </script>
</body>
</html>
